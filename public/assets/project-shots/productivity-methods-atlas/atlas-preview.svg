<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Productivity Methods Atlas preview</title>
  <desc id="desc">A dark diagnostic atlas interface with method categories, failure patterns, and chooser matrix cards.</desc>
