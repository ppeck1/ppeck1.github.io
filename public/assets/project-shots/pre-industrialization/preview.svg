<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pre-Industrialization Knowledge Canon preview</title>
  <desc id="desc">A dark educational atlas showing provision, protection, and meaning as a craft knowledge map.</desc>
  <rect width="1280" height="720" fill="#101318"/>
  <rect x="58" y="50" width="1164" height="620" rx="18" fill="#151a22" stroke="#f2c14e" stroke-width="3"/>
  <text x="96" y="116" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Pre-Industrialization Knowledge Canon</text>
  <text x="96" y="158" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">A craft-first atlas for provision, protection, and meaning</text>
  <g transform="translate(95 215)">
    <rect width="320" height="335" rx="12" fill="#1f2937" stroke="#334155"/>
    <circle cx="58" cy="60" r="18" fill="#ffd166"/>
    <text x="92" y="68" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Provision</text>
    <text x="34" y="122" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="20">food, water, shelter, heat</text>
    <text x="34" y="164" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="20">repair and exchange</text>
    <text x="34" y="238" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="18">Time and nature set the</text>
    <text x="34" y="268" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="18">constraints.</text>
  </g>
  <g transform="translate(480 215)">
    <rect width="320" height="335" rx="12" fill="#1f2937" stroke="#334155"/>
    <circle cx="58" cy="60" r="18" fill="#7bdff2"/>
    <text x="92" y="68" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Protection</text>
    <text x="34" y="122" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="20">defense, warning, fairness</text>
    <text x="34" y="164" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="20">trust and repair</text>
    <text x="34" y="238" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="18">A community needs limits</text>
    <text x="34" y="268" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="18">that people understand.</text>
  </g>
  <g transform="translate(865 215)">
    <rect width="320" height="335" rx="12" fill="#1f2937" stroke="#334155"/>
    <circle cx="58" cy="60" r="18" fill="#b388ff"/>
    <text x="92" y="68" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Meaning</text>
    <text x="34" y="122" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="20">story, memory, teaching</text>
    <text x="34" y="164" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="20">humility and stewardship</text>
    <text x="34" y="238" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="18">Skills survive when they</text>
    <text x="34" y="268" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="18">are practiced and shared.</text>
  </g>
  <text x="96" y="622" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="21">Standalone local HTML essays converted into a portfolio-safe project summary.</text>
</svg>
