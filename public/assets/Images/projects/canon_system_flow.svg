<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0d1524"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2a45"/>
      <stop offset="100%" stop-color="#071828"/>
    </linearGradient>
    <linearGradient id="projGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#0d0a1e"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00c4f0"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f5a020"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg)"/>
  <rect width="900" height="420" fill="url(#grid)"/>

  <!-- Top label -->
  <text x="450" y="28" text-anchor="middle" font-size="11" fill="#4a7fa5" letter-spacing="3">CANON — SYSTEM EVOLUTION MODEL</text>
  <line x1="60" y1="36" x2="840" y2="36" stroke="#1a3a5c" stroke-width="0.5"/>

  <!-- TIME AXIS ARROW -->
  <line x1="60" y1="390" x2="840" y2="390" stroke="#1a3a5c" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <text x="450" y="408" text-anchor="middle" font-size="10" fill="#2a5a7a" letter-spacing="2">TIME →</text>
  <text x="65" y="408" font-size="9" fill="#1a3a5c">t</text>
  <text x="820" y="408" font-size="9" fill="#1a3a5c">t+n</text>

  <!-- ═══ NODE 1: Latent State x_t ═══ -->
  <rect x="58" y="80" width="145" height="220" rx="4" fill="url(#nodeGrad)" stroke="#00aaff" stroke-width="1.2" filter="url(#subtleGlow)"/>
  <rect x="58" y="80" width="145" height="28" rx="4" fill="#0a2040"/>
  <rect x="58" y="100" width="145" height="8" rx="0" fill="#0a2040"/>
  <text x="130" y="99" text-anchor="middle" font-size="10.5" fill="#00d4ff" letter-spacing="1" font-weight="bold">LATENT STATE</text>
  <text x="130" y="114" text-anchor="middle" font-size="13" fill="#00d4ff" filter="url(#glow)">x_t</text>

  <text x="75" y="148" font-size="9" fill="#4a8ab5">Ω_V</text>
  <text x="155" y="148" text-anchor="end" font-size="9" fill="#aaccdd">viability margin</text>
  <line x1="75" y1="152" x2="185" y2="152" stroke="#1a3a5c" stroke-width="0.5"/>

  <text x="75" y="170" font-size="9" fill="#4a8ab5">Π</text>
  <text x="155" y="170" text-anchor="end" font-size="9" fill="#aaccdd">regulation pressure</text>
  <line x1="75" y1="174" x2="185" y2="174" stroke="#1a3a5c" stroke-width="0.5"/>

  <text x="75" y="192" font-size="9" fill="#4a8ab5">H</text>
  <text x="155" y="192" text-anchor="end" font-size="9" fill="#aaccdd">history / load</text>
  <line x1="75" y1="196" x2="185" y2="196" stroke="#1a3a5c" stroke-width="0.5"/>

  <text x="75" y="214" font-size="9" fill="#4a8ab5">C_x</text>
  <text x="155" y="214" text-anchor="end" font-size="9" fill="#aaccdd">coherence</text>
  <line x1="75" y1="218" x2="185" y2="218" stroke="#1a3a5c" stroke-width="0.5"/>

  <text x="75" y="236" font-size="9" fill="#4a8ab5">L_P</text>
  <text x="155" y="236" text-anchor="end" font-size="9" fill="#aaccdd">projection loss</text>
  <line x1="75" y1="240" x2="185" y2="240" stroke="#1a3a5c" stroke-width="0.5"/>

  <text x="75" y="258" font-size="9" fill="#4a8ab5">A_s</text>
  <text x="155" y="258" text-anchor="end" font-size="9" fill="#aaccdd">accessible volume</text>
  <line x1="75" y1="262" x2="185" y2="262" stroke="#1a3a5c" stroke-width="0.5"/>

  <text x="130" y="290" text-anchor="middle" font-size="8" fill="#2a5a7a" font-style="italic">unobserved</text>

  <!-- ═══ ARROW 1 → F block ═══ -->
  <line x1="203" y1="190" x2="265" y2="190" stroke="#00c4f0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- ═══ NODE 2: F(x_t) ═══ -->
  <rect x="268" y="130" width="130" height="120" rx="4" fill="url(#nodeGrad)" stroke="#0088cc" stroke-width="1.2"/>
  <rect x="268" y="130" width="130" height="28" rx="4" fill="#071828"/>
  <rect x="268" y="150" width="130" height="8" fill="#071828"/>
  <text x="333" y="149" text-anchor="middle" font-size="10" fill="#00b8e0" letter-spacing="1">LATENT EVOLUTION</text>
  <text x="333" y="172" text-anchor="middle" font-size="16" fill="#00c4f0" filter="url(#glow)">F(x_t)</text>
  <text x="333" y="196" text-anchor="middle" font-size="8.5" fill="#5a8aaa">unconstrained dynamics</text>
  <line x1="285" y1="204" x2="380" y2="204" stroke="#1a3a5c" stroke-width="0.4"/>
  <text x="333" y="222" text-anchor="middle" font-size="8" fill="#3a6a8a" font-style="italic">internal system forces</text>
  <text x="333" y="237" text-anchor="middle" font-size="8" fill="#3a6a8a" font-style="italic">load dynamics · drift</text>

  <!-- ═══ ARROW 2 → Pi_K block ═══ -->
  <line x1="398" y1="190" x2="462" y2="190" stroke="#00c4f0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="430" y="182" text-anchor="middle" font-size="8" fill="#2a5a7a">pre-projection</text>

  <!-- ═══ NODE 3: Pi_K (Constraint Projection) ═══ -->
  <rect x="465" y="100" width="155" height="190" rx="4" fill="#0e1a10" stroke="#00cc66" stroke-width="1.4" filter="url(#subtleGlow)"/>
  <rect x="465" y="100" width="155" height="28" rx="4" fill="#071a0a"/>
  <rect x="465" y="120" width="155" height="8" fill="#071a0a"/>
  <text x="542" y="119" text-anchor="middle" font-size="10" fill="#00cc66" letter-spacing="1">CONSTRAINT PROJ.</text>
  <text x="542" y="148" text-anchor="middle" font-size="18" fill="#00ee77" filter="url(#glow)">Π_K</text>

  <text x="542" y="172" text-anchor="middle" font-size="8.5" fill="#3a8a5a">viability enforcement</text>
  <line x1="480" y1="180" x2="605" y2="180" stroke="#1a3a2a" stroke-width="0.4"/>

  <text x="480" y="198" font-size="8.5" fill="#2a6a3a">K =</text>
  <text x="500" y="198" font-size="8.5" fill="#60aa70">feasible region</text>
  <text x="480" y="214" font-size="8.5" fill="#60aa70">→ rejects invalid states</text>
  <text x="480" y="228" font-size="8.5" fill="#60aa70">→ enforces boundaries</text>
  <text x="480" y="242" font-size="8.5" fill="#60aa70">→ preserves viability</text>

  <text x="542" y="278" text-anchor="middle" font-size="8" fill="#1a5a2a" font-style="italic">Δc* &gt; 0 required</text>

  <!-- ═══ ARROW 3 → Output ═══ -->
  <line x1="620" y1="190" x2="686" y2="190" stroke="#00c4f0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="653" y="182" text-anchor="middle" font-size="8" fill="#2a5a7a">x_{t+1}</text>

  <!-- ═══ NODE 4: Projected Output / Observables ═══ -->
  <rect x="689" y="80" width="148" height="220" rx="4" fill="url(#projGrad)" stroke="#9966ff" stroke-width="1.2"/>
  <rect x="689" y="80" width="148" height="28" rx="4" fill="#12082a"/>
  <rect x="689" y="100" width="148" height="8" fill="#12082a"/>
  <text x="763" y="99" text-anchor="middle" font-size="10" fill="#aa88ff" letter-spacing="1">OBSERVED STATE</text>
  <text x="763" y="118" text-anchor="middle" font-size="12" fill="#bb99ff" filter="url(#glow)">Y = P_K(x̃)</text>

  <text x="706" y="150" font-size="9" fill="#7755aa">occupancy</text>
  <text x="826" y="150" text-anchor="end" font-size="8" fill="#554477">↙ compressed</text>
  <line x1="706" y1="154" x2="826" y2="154" stroke="#1a102a" stroke-width="0.5"/>

  <text x="706" y="172" font-size="9" fill="#7755aa">throughput</text>
  <text x="826" y="172" text-anchor="end" font-size="8" fill="#554477">↙ compressed</text>
  <line x1="706" y1="176" x2="826" y2="176" stroke="#1a102a" stroke-width="0.5"/>

  <text x="706" y="194" font-size="9" fill="#7755aa">KPI metrics</text>
  <text x="826" y="194" text-anchor="end" font-size="8" fill="#554477">↙ compressed</text>
  <line x1="706" y1="198" x2="826" y2="198" stroke="#1a102a" stroke-width="0.5"/>

  <text x="706" y="216" font-size="9" fill="#7755aa">dashboards</text>
  <text x="826" y="216" text-anchor="end" font-size="8" fill="#554477">↙ compressed</text>
  <line x1="706" y1="220" x2="826" y2="220" stroke="#1a102a" stroke-width="0.5"/>

  <rect x="705" y="230" width="126" height="42" rx="3" fill="#1a0f2a"/>
  <text x="768" y="248" text-anchor="middle" font-size="8" fill="#ff6666">PROJECTION LOSS:</text>
  <text x="768" y="262" text-anchor="middle" font-size="8" fill="#cc4444">L_P = I(x̃) − I(P_K(x̃))</text>

  <text x="763" y="290" text-anchor="middle" font-size="8" fill="#3a2a5a" font-style="italic">what dashboards see</text>

  <!-- ═══ KEY IMPLICATION ═══ -->
  <rect x="58" y="330" width="779" height="46" rx="3" fill="#0a0f1a" stroke="#1a3050" stroke-width="0.7"/>
  <text x="70" y="350" font-size="9" fill="#3a6a8a">KEY IMPLICATION</text>
  <text x="70" y="368" font-size="11" fill="#aaccdd">The system you <tspan fill="#00d4ff">observe</tspan> is not the system that <tspan fill="#00ee77">exists</tspan>. Latent state diverges from projected metrics.</text>

  <!-- tick marks on time axis -->
  <line x1="130" y1="387" x2="130" y2="393" stroke="#1a3a5c" stroke-width="1"/>
  <line x1="333" y1="387" x2="333" y2="393" stroke="#1a3a5c" stroke-width="1"/>
  <line x1="542" y1="387" x2="542" y2="393" stroke="#1a3a5c" stroke-width="1"/>
  <line x1="763" y1="387" x2="763" y2="393" stroke="#1a3a5c" stroke-width="1"/>
</svg>
